<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>備品管理</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;background:#f5f5f5;color:#222}
.app{max-width:480px;margin:0 auto;padding:12px}
.header{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:14px;border:1px solid #e0e0e0;display:flex;align-items:center;justify-content:space-between}
.h-left h1{font-size:20px;font-weight:600}
.h-left p{font-size:12px;color:#888;margin-top:2px}
.sync-btn{padding:8px 12px;font-size:14px;border:1px solid #ccc;border-radius:8px;background:#fff;cursor:pointer}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;padding:10px 4px;border:1px solid #ccc;border-radius:8px;background:#fff;font-size:14px;color:#888;cursor:pointer;text-align:center;line-height:1.5}
.tab.active{background:#e8f0fe;border-color:#4a90e2;color:#1a56b0;font-weight:600}
.sec{display:none}.sec.active{display:block}
.card{background:#fff;border:1px solid #e0e0e0;border-radius:14px;padding:16px;margin-bottom:12px}
.item-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.item-name{font-size:22px;font-weight:600}
.edit-btn{padding:7px 12px;font-size:14px;border:1px solid #ccc;border-radius:8px;background:#fff;cursor:pointer}
.stock-row{display:flex;align-items:baseline;gap:6px;margin-bottom:12px}
.stock-num{font-size:40px;font-weight:700}
.stock-unit{font-size:17px;color:#888}
.badge{display:inline-block;font-size:13px;padding:4px 10px;border-radius:8px;margin-left:8px}
.b-ok{background:#e6f4ea;color:#1e7e34}
.b-low{background:#fff8e1;color:#b45309}
.b-out{background:#fdecea;color:#b91c1c}
.in-row{display:flex;gap:8px;align-items:center;border-top:1px solid #eee;padding-top:12px}
.in-row label{font-size:14px;color:#888;white-space:nowrap}
.in-row input{flex:1;padding:10px;font-size:20px;border:1px solid #ccc;border-radius:8px;text-align:center;min-width:0}
.btn-in{padding:10px 14px;background:#e6f4ea;color:#1e7e34;border:1px solid #a7d7b0;border-radius:8px;font-size:16px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn-in:disabled{opacity:0.5}
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:100;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:20px;width:90%;max-width:400px}
.modal-title{font-size:18px;font-weight:600;margin-bottom:14px}
.frow{margin-bottom:10px}
.frow label{font-size:14px;color:#888;display:block;margin-bottom:4px}
.frow input{width:100%;padding:11px;font-size:18px;border:1px solid #ccc;border-radius:8px}
.modal-btns{display:flex;gap:8px;margin-top:14px}
.btn-save{flex:2;padding:13px;background:#e8f0fe;color:#1a56b0;border:1px solid #4a90e2;border-radius:8px;font-size:17px;cursor:pointer;font-weight:600}
.btn-del{padding:13px 14px;background:#fdecea;color:#b91c1c;border:1px solid #f5a0a0;border-radius:8px;font-size:17px;cursor:pointer}
.btn-cancel{flex:1;padding:13px;border:1px solid #ccc;border-radius:8px;font-size:17px;cursor:pointer;background:#fff}
.sum-card{background:#fff;border:1px solid #e0e0e0;border-radius:14px;padding:16px;margin-bottom:12px}
.sum-title{font-size:16px;font-weight:600;margin-bottom:12px}
.sum-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #eee}
.sum-row:last-child{border-bottom:none}
.sname{font-size:19px}
.sval{font-size:24px;font-weight:700}
.add-card{background:#fff;border:1px solid #e0e0e0;border-radius:14px;padding:16px;margin-bottom:12px}
.add-card label{font-size:15px;color:#888;display:block;margin-bottom:5px}
.add-card input{width:100%;padding:11px;font-size:18px;border:1px solid #ccc;border-radius:8px;margin-bottom:11px}
.btn-full{width:100%;padding:14px;background:#e8f0fe;color:#1a56b0;border:1px solid #4a90e2;border-radius:8px;font-size:18px;cursor:pointer;font-weight:600}
.loading{text-align:center;padding:36px;font-size:16px;color:#888}
.err{background:#fdecea;color:#b91c1c;border:1px solid #f5a0a0;border-radius:8px;padding:12px;font-size:15px;margin-bottom:12px}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="h-left">
      <h1>📦 備品管理</h1>
      <p id="sync-time">読み込み中...</p>
    </div>
    <button class="sync-btn" onclick="loadItems()">🔄 更新</button>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="sw('stock')">📦<br>在庫</div>
    <div class="tab" onclick="sw('summary')">📊<br>集計</div>
    <div class="tab" onclick="sw('add')">➕<br>品目追加</div>
  </div>

  <div id="overlay" class="overlay" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-title">✏️ 品目を編集</div>
      <input type="hidden" id="e-id"/>
      <div class="frow"><label>品目名</label><input type="text" id="e-name"/></div>
      <div class="frow"><label>単位</label><input type="text" id="e-unit"/></div>
      <div class="frow"><label>現在の在庫数</label><input type="number" id="e-qty" min="0"/></div>
      <div class="frow"><label>下限アラート数</label><input type="number" id="e-min" min="0"/></div>
      <div class="modal-btns">
        <button class="btn-save" onclick="saveEdit()">✅ 保存</button>
        <button class="btn-del" onclick="doDelete()">🗑</button>
        <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
      </div>
    </div>
  </div>

  <div id="sec-stock" class="sec active"><div class="loading">読み込み中...</div></div>
  <div id="sec-summary" class="sec"></div>
  <div id="sec-add" class="sec">
    <div class="add-card">
      <label>品目名</label><input type="text" id="n-name" placeholder="例：みりん"/>
      <label>単位（本・袋・個など）</label><input type="text" id="n-unit" placeholder="例：本"/>
      <label>現在の在庫数</label><input type="number" id="n-qty" placeholder="0" min="0"/>
      <label>下限アラート数</label><input type="number" id="n-min" placeholder="2" min="0"/>
      <button class="btn-full" onclick="addItem()">➕ 追加する</button>
    </div>
  </div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwKAKQIjdUW18oly8DWJwWgpEE0UU2_CgdisEKmNGnVmjzsXeGhnh-yTCgdabvvaaxE/exec';
let items = [];

async function gasGet(){
  const r = await fetch(GAS_URL+'?t='+Date.now());
  return r.json();
}
async function gasPost(p){
  const r = await fetch(GAS_URL,{method:'POST',body:JSON.stringify(p)});
  return r.json();
}
function status(item){
  const q=Number(item.qty),m=Number(item.min_qty);
  if(q===0)return['out','在庫なし'];
  if(q<=m)return['low','残り少ない'];
  return['ok','在庫あり'];
}
function renderStock(){
  const el=document.getElementById('sec-stock');
  if(!items.length){el.innerHTML='<div class="loading">品目がありません<br>「品目追加」から追加してください</div>';return;}
  el.innerHTML=items.map(item=>{
    const[cls,lbl]=status(item);
    return`<div class="card">
      <div class="item-top"><span class="item-name">${item.name}</span>
      <button class="edit-btn" onclick="openEdit('${item.id}')">✏️ 編集</button></div>
      <div class="stock-row"><span class="stock-num">${Math.round(Number(item.qty))}</span>
      <span class="stock-unit">${item.unit}</span>
      <span class="badge b-${cls}">${lbl}</span></div>
      <div class="in-row"><label>入庫数</label>
      <input type="number" id="q-${item.id}" value="1" min="1"/>
      <button class="btn-in" id="btn-${item.id}" onclick="addStock('${item.id}')">＋ 入庫</button></div>
    </div>`;
  }).join('');
}
function renderSummary(){
  const el=document.getElementById('sec-summary');
  const d=new Date();
  const title=d.getFullYear()+'年'+(d.getMonth()+1)+'月 在庫一覧';
  const rows=items.map(item=>{
    const[cls,lbl]=status(item);
    return`<div class="sum-row"><span class="sname">${item.name}</span>
    <div style="text-align:right"><span class="sval">${Math.round(Number(item.qty))}${item.unit}</span><br>
    <span class="badge b-${cls}" style="font-size:12px">${lbl}</span></div></div>`;
  }).join('');
  el.innerHTML=`<div class="sum-card"><p class="sum-title">📅 ${title}</p>${rows||'<p style="color:#888">データがありません</p>'}</div>`;
}
async function loadItems(){
  document.getElementById('sec-stock').innerHTML='<div class="loading">スプレッドシートから読込中...</div>';
  try{
    const data=await gasGet();
    items=data.filter(d=>d.id&&d.name);
    const now=new Date();
    document.getElementById('sync-time').textContent=
      (now.getMonth()+1)+'月'+now.getDate()+'日 '+
      now.getHours()+':'+now.getMinutes().toString().padStart(2,'0')+' 同期';
    renderStock();renderSummary();
  }catch(e){
    document.getElementById('sec-stock').innerHTML='<div class="err">読み込みエラー。しばらく待って更新ボタンを押してください。</div>';
    document.getElementById('sync-time').textContent='エラー';
  }
}
async function addStock(id){
  const inp=document.getElementById('q-'+id);
  const btn=document.getElementById('btn-'+id);
  const qty=parseInt(inp.value)||0;
  if(qty<=0){inp.style.borderColor='red';setTimeout(()=>inp.style.borderColor='',1000);return;}
  const item=items.find(i=>String(i.id)===String(id));
  if(!item)return;
  btn.disabled=true;btn.textContent='保存中...';
  await gasPost({action:'update',id,qty:Number(item.qty)+qty});
  inp.value=1;await loadItems();
}
function openEdit(id){
  const item=items.find(i=>String(i.id)===String(id));
  if(!item)return;
  document.getElementById('e-id').value=id;
  document.getElementById('e-name').value=item.name;
  document.getElementById('e-unit').value=item.unit;
  document.getElementById('e-qty').value=Math.round(Number(item.qty));
  document.getElementById('e-min').value=Math.round(Number(item.min_qty));
  document.getElementById('overlay').classList.add('open');
}
function closeModal(e){if(!e||e.target===document.getElementById('overlay'))document.getElementById('overlay').classList.remove('open');}
async function saveEdit(){
  const id=document.getElementById('e-id').value;
  const name=document.getElementById('e-name').value.trim();
  const unit=document.getElementById('e-unit').value.trim();
  const qty=parseInt(document.getElementById('e-qty').value)||0;
  const min_qty=parseInt(document.getElementById('e-min').value)||0;
  if(!name)return;
  await gasPost({action:'edit',id,name,unit,qty,min_qty});
  closeModal();await loadItems();
}
async function doDelete(){
  const id=document.getElementById('e-id').value;
  const item=items.find(i=>String(i.id)===String(id));
  if(!confirm((item?item.name:'品目')+'を削除しますか？'))return;
  await gasPost({action:'delete',id});
  closeModal();await loadItems();
}
async function addItem(){
  const name=document.getElementById('n-name').value.trim();
  const unit=document.getElementById('n-unit').value.trim()||'個';
  const qty=parseInt(document.getElementById('n-qty').value)||0;
  const min_qty=parseInt(document.getElementById('n-min').value)||1;
  if(!name)return;
  const id='i'+Date.now();
  await gasPost({action:'add',id,name,unit,qty,min_qty});
  document.getElementById('n-name').value='';
  document.getElementById('n-unit').value='';
  document.getElementById('n-qty').value='';
  document.getElementById('n-min').value='';
  sw('stock');await loadItems();
}
function sw(tab){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['stock','summary','add'][i]===tab));
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
  document.getElementById('sec-'+tab).classList.add('active');
}
loadItems();
</script>
</body>
</html>
