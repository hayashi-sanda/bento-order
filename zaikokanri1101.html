<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>備品管理</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;background:#f5f5f5;color:#222}
.app{max-width:480px;margin:0 auto;padding:12px}
.header{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:14px;border:1px solid #e0e0e0;display:flex;align-items:center;justify-content:space-between}
.h-left h1{font-size:22px;font-weight:700}
.h-left p{font-size:12px;color:#888;margin-top:2px}
.sync-btn{padding:9px 14px;font-size:15px;border:1px solid #ccc;border-radius:8px;background:#fff;cursor:pointer}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{flex:1;padding:10px 2px;border:1px solid #ccc;border-radius:8px;background:#fff;font-size:13px;color:#888;cursor:pointer;text-align:center;line-height:1.5}
.tab.active{background:#e8f0fe;border-color:#4a90e2;color:#1a56b0;font-weight:700}
.sec{display:none}.sec.active{display:block}
.card{background:#fff;border:1px solid #e0e0e0;border-radius:14px;padding:16px;margin-bottom:12px}
.item-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.item-name{font-size:22px;font-weight:700}
.item-unit{font-size:13px;color:#888;margin-bottom:8px}
.edit-btn{padding:8px 14px;font-size:14px;border:1px solid #ccc;border-radius:8px;background:#fff;cursor:pointer}
.stock-row{display:flex;align-items:baseline;gap:6px;margin-bottom:8px}
.stock-num{font-size:44px;font-weight:700}
.stock-unit{font-size:18px;color:#888}
.badge{display:inline-block;font-size:14px;padding:5px 12px;border-radius:8px;margin-left:8px}
.b-ok{background:#e6f4ea;color:#1e7e34}
.b-low{background:#fff8e1;color:#b45309}
.b-out{background:#fdecea;color:#b91c1c}
.memo-box{background:#fffde7;border:1px solid #ffe082;border-radius:8px;padding:8px 12px;font-size:14px;color:#555;margin-bottom:10px;min-height:32px;white-space:pre-wrap;word-break:break-all}
.memo-empty{color:#bbb;font-style:italic}
.io-row{display:flex;gap:8px;align-items:center;padding:10px 0}
.io-row:first-of-type{border-top:1px solid #eee}
.io-row+.io-row{border-top:1px solid #f0f0f0}
.io-row label{font-size:14px;color:#888;white-space:nowrap;width:44px}
.io-row input{flex:1;padding:11px;font-size:20px;border:1px solid #ccc;border-radius:8px;text-align:center;min-width:0}
.btn-in{padding:12px 14px;background:#e6f4ea;color:#1e7e34;border:1px solid #a7d7b0;border-radius:8px;font-size:16px;cursor:pointer;font-weight:700;white-space:nowrap}
.btn-out{padding:12px 14px;background:#fdecea;color:#b91c1c;border:1px solid #f5a0a0;border-radius:8px;font-size:16px;cursor:pointer;font-weight:700;white-space:nowrap}
.btn-in:disabled,.btn-out:disabled{opacity:0.5}
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:100;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px 0}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:20px;width:92%;max-width:420px;margin:auto}
.modal-title{font-size:20px;font-weight:700;margin-bottom:14px}
.frow{margin-bottom:12px}
.frow label{font-size:15px;color:#888;display:block;margin-bottom:4px}
.frow input,.frow textarea{width:100%;padding:12px;font-size:17px;border:1px solid #ccc;border-radius:8px;font-family:inherit}
.frow textarea{height:80px;resize:vertical;font-size:15px}
.modal-btns{display:flex;gap:8px;margin-top:14px}
.btn-save{flex:2;padding:14px;background:#e8f0fe;color:#1a56b0;border:1px solid #4a90e2;border-radius:8px;font-size:18px;cursor:pointer;font-weight:700}
.btn-del{padding:14px 16px;background:#fdecea;color:#b91c1c;border:1px solid #f5a0a0;border-radius:8px;font-size:18px;cursor:pointer}
.btn-cancel{flex:1;padding:14px;border:1px solid #ccc;border-radius:8px;font-size:18px;cursor:pointer;background:#fff}
.sum-card{background:#fff;border:1px solid #e0e0e0;border-radius:14px;padding:16px;margin-bottom:12px}
.sum-title{font-size:17px;font-weight:700;margin-bottom:12px}
.sum-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee}
.sum-row:last-child{border-bottom:none}
.sname{font-size:18px}
.sunit{font-size:12px;color:#888}
.sval{font-size:26px;font-weight:700}
.sin{font-size:13px;color:#1e7e34}
.sout{font-size:13px;color:#b91c1c}
.add-card{background:#fff;border:1px solid #e0e0e0;border-radius:14px;padding:16px;margin-bottom:12px}
.add-card label{font-size:15px;color:#888;display:block;margin-bottom:5px}
.add-card input,.add-card textarea{width:100%;padding:12px;font-size:17px;border:1px solid #ccc;border-radius:8px;margin-bottom:12px;font-family:inherit}
.add-card textarea{height:70px;resize:vertical;font-size:15px}
.btn-full{width:100%;padding:15px;background:#e8f0fe;color:#1a56b0;border:1px solid #4a90e2;border-radius:8px;font-size:19px;cursor:pointer;font-weight:700}
.loading{text-align:center;padding:40px;font-size:17px;color:#888}
.err{background:#fdecea;color:#b91c1c;border:1px solid #f5a0a0;border-radius:8px;padding:14px;font-size:16px;margin-bottom:12px}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="h-left">
      <h1>📦 備品管理</h1>
      <p id="sync-time">読み込み中...</p>
    </div>
    <button class="sync-btn" onclick="loadItems()">🔄 更新</button>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="sw('stock')">📦<br>在庫</div>
    <div class="tab" onclick="sw('summary')">📊<br>集計</div>
    <div class="tab" onclick="sw('add')">➕<br>品目追加</div>
  </div>

  <div id="overlay" class="overlay" onclick="bgClose(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-title">✏️ 品目を編集</div>
      <input type="hidden" id="e-id"/>
      <div class="frow"><label>品目名</label><input type="text" id="e-name"/></div>
      <div class="frow"><label>容量・単位（例：1L、500ml）</label><input type="text" id="e-unit"/></div>
      <div class="frow"><label>現在の在庫数</label><input type="number" id="e-qty" min="0"/></div>
      <div class="frow"><label>下限アラート数</label><input type="number" id="e-min" min="0"/></div>
      <div class="frow"><label>📝 メモ</label><textarea id="e-memo" placeholder="仕入れ先・注意事項など"></textarea></div>
      <div class="modal-btns">
        <button class="btn-save" onclick="saveEdit()">✅ 保存</button>
        <button class="btn-del" onclick="doDelete()">🗑</button>
        <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
      </div>
    </div>
  </div>

  <div id="sec-stock" class="sec active"><div class="loading">読み込み中...</div></div>
  <div id="sec-summary" class="sec"></div>
  <div id="sec-add" class="sec">
    <div class="add-card">
      <label>品目名</label><input type="text" id="n-name" placeholder="例：醤油"/>
      <label>容量・単位（例：1L、500ml）</label><input type="text" id="n-unit" placeholder="例：1L"/>
      <label>現在の在庫数</label><input type="number" id="n-qty" placeholder="0" min="0"/>
      <label>下限アラート数</label><input type="number" id="n-min" placeholder="2" min="0"/>
      <label>📝 メモ（仕入れ先・注意事項など）</label>
      <textarea id="n-memo" placeholder="自由に記入できます"></textarea>
      <button class="btn-full" onclick="addItem()">➕ 追加する</button>
    </div>
  </div>
</div>

<script>
const GAS='https://script.google.com/macros/s/AKfycbwKAKQIjdUW18oly8DWJwWgpEE0UU2_CgdisEKmNGnVmjzsXeGhnh-yTCgdabvvaaxE/exec';
let items=[];

async function gasGet(){
  const r=await fetch(GAS+'?t='+Date.now());
  return r.json();
}
async function gasPost(p){
  const r=await fetch(GAS,{method:'POST',body:JSON.stringify(p)});
  return r.json();
}
function status(item){
  const q=Number(item.qty),m=Number(item.min_qty);
  if(q===0)return['out','在庫なし'];
  if(q<=m)return['low','残り少ない'];
  return['ok','在庫あり'];
}
function renderStock(){
  const el=document.getElementById('sec-stock');
  if(!items.length){el.innerHTML='<div class="loading">品目がありません<br>「品目追加」から追加してください</div>';return;}
  el.innerHTML=items.map(item=>{
    const[cls,lbl]=status(item);
    const memo=item.memo?`<div class="memo-box">${item.memo}</div>`:`<div class="memo-box memo-empty">メモなし</div>`;
    return`<div class="card">
      <div class="item-top">
        <span class="item-name">${item.name}</span>
        <button class="edit-btn" onclick="openEdit('${item.id}')">✏️ 編集</button>
      </div>
      <div class="item-unit">容量・単位：${item.unit}</div>
      <div class="stock-row">
        <span class="stock-num">${Math.round(Number(item.qty))}</span>
        <span class="stock-unit">本</span>
        <span class="badge b-${cls}">${lbl}</span>
      </div>
      ${memo}
      <div class="io-row">
        <label>入庫</label>
        <input type="number" id="in-${item.id}" value="1" min="1"/>
        <button class="btn-in" id="bin-${item.id}" onclick="doIn('${item.id}')">＋ 入庫</button>
      </div>
      <div class="io-row">
        <label>出庫</label>
        <input type="number" id="out-${item.id}" value="1" min="1"/>
        <button class="btn-out" id="bout-${item.id}" onclick="doOut('${item.id}')">－ 出庫</button>
      </div>
    </div>`;
  }).join('');
}
function renderSummary(){
  const el=document.getElementById('sec-summary');
  const d=new Date();
  const title=d.getFullYear()+'年'+(d.getMonth()+1)+'月 在庫一覧';
  const rows=items.map(item=>{
    const[cls,lbl]=status(item);
    return`<div class="sum-row">
      <div><span class="sname">${item.name}</span><br><span class="sunit">${item.unit}</span></div>
      <div style="text-align:right">
        <span class="sval">${Math.round(Number(item.qty))}本</span><br>
        <span class="badge b-${cls}" style="font-size:12px">${lbl}</span>
      </div>
    </div>`;
  }).join('');
  el.innerHTML=`<div class="sum-card"><p class="sum-title">📅 ${title}</p>${rows||'<p style="color:#888">データがありません</p>'}</div>`;
}
async function loadItems(){
  document.getElementById('sec-stock').innerHTML='<div class="loading">読み込み中...</div>';
  try{
    const data=await gasGet();
    items=data.filter(d=>d.id&&d.name);
    const now=new Date();
    document.getElementById('sync-time').textContent=
      (now.getMonth()+1)+'月'+now.getDate()+'日 '+
      now.getHours()+':'+now.getMinutes().toString().padStart(2,'0')+' 同期';
    renderStock();renderSummary();
  }catch(e){
    document.getElementById('sec-stock').innerHTML='<div class="err">読み込みエラー。更新ボタンを押してください。</div>';
    document.getElementById('sync-time').textContent='エラー';
  }
}
async function doIn(id){
  const inp=document.getElementById('in-'+id);
  const btn=document.getElementById('bin-'+id);
  const qty=parseInt(inp.value)||0;
  if(qty<=0){inp.style.borderColor='red';setTimeout(()=>inp.style.borderColor='',1000);return;}
  const item=items.find(i=>String(i.id)===String(id));
  if(!item)return;
  btn.disabled=true;btn.textContent='保存中...';
  await gasPost({action:'update',id,qty:Number(item.qty)+qty});
  inp.value=1;await loadItems();
}
async function doOut(id){
  const inp=document.getElementById('out-'+id);
  const btn=document.getElementById('bout-'+id);
  const qty=parseInt(inp.value)||0;
  if(qty<=0){inp.style.borderColor='red';setTimeout(()=>inp.style.borderColor='',1000);return;}
  const item=items.find(i=>String(i.id)===String(id));
  if(!item)return;
  const newQty=Number(item.qty)-qty;
  if(newQty<0){alert('在庫数が足りません！現在の在庫：'+Math.round(Number(item.qty))+'本');return;}
  btn.disabled=true;btn.textContent='保存中...';
  await gasPost({action:'update',id,qty:newQty});
  inp.value=1;await loadItems();
}
function openEdit(id){
  const item=items.find(i=>String(i.id)===String(id));
  if(!item)return;
  document.getElementById('e-id').value=id;
  document.getElementById('e-name').value=item.name;
  document.getElementById('e-unit').value=item.unit;
  document.getElementById('e-qty').value=Math.round(Number(item.qty));
  document.getElementById('e-min').value=Math.round(Number(item.min_qty));
  document.getElementById('e-memo').value=item.memo||'';
  document.getElementById('overlay').classList.add('open');
}
function bgClose(e){if(e.target===document.getElementById('overlay'))closeModal();}
function closeModal(){document.getElementById('overlay').classList.remove('open');}
async function saveEdit(){
  const id=document.getElementById('e-id').value;
  const name=document.getElementById('e-name').value.trim();
  const unit=document.getElementById('e-unit').value.trim();
  const qty=parseInt(document.getElementById('e-qty').value)||0;
  const min_qty=parseInt(document.getElementById('e-min').value)||0;
  const memo=document.getElementById('e-memo').value.trim();
  if(!name)return;
  await gasPost({action:'edit',id,name,unit,qty,min_qty,memo});
  closeModal();await loadItems();
}
async function doDelete(){
  const id=document.getElementById('e-id').value;
  const item=items.find(i=>String(i.id)===String(id));
  if(!confirm((item?item.name:'品目')+'を削除しますか？'))return;
  await gasPost({action:'delete',id});
  closeModal();await loadItems();
}
async function addItem(){
  const name=document.getElementById('n-name').value.trim();
  const unit=document.getElementById('n-unit').value.trim()||'本';
  const qty=parseInt(document.getElementById('n-qty').value)||0;
  const min_qty=parseInt(document.getElementById('n-min').value)||1;
  const memo=document.getElementById('n-memo').value.trim();
  if(!name)return;
  const id='i'+Date.now();
  await gasPost({action:'add',id,name,unit,qty,min_qty,memo});
  document.getElementById('n-name').value='';
  document.getElementById('n-unit').value='';
  document.getElementById('n-qty').value='';
  document.getElementById('n-min').value='';
  document.getElementById('n-memo').value='';
  sw('stock');await loadItems();
}
function sw(tab){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['stock','summary','add'][i]===tab));
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
  document.getElementById('sec-'+tab).classList.add('active');
}
loadItems();
</script>
</body>
</html>
